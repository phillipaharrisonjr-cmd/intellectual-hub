<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Denali Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f4f4f2;
      color: #1f2933;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #1f2933;
      color: #fff;
      padding: 16px 24px;
    }
    header h1 { font-size: 20px; font-weight: 600; }
    header p { font-size: 13px; color: #cbd2d9; margin-top: 2px; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      margin-bottom: 14px;
      padding: 12px 16px;
      border-radius: 10px;
      max-width: 85%;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .user { background: #1f2933; color: #fff; margin-left: auto; }
    .assistant { background: #fff; border: 1px solid #e0e3e7; }
    .error { background: #fdecea; border: 1px solid #f5c6c2; color: #a12622; }
    form {
      display: flex;
      gap: 10px;
      padding: 16px 24px;
      background: #fff;
      border-top: 1px solid #e0e3e7;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }
    input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #cbd2d9;
      border-radius: 8px;
      font-size: 15px;
    }
    input:focus { outline: 2px solid #1f2933; border-color: transparent; }
    button {
      padding: 12px 22px;
      background: #1f2933;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>Denali</h1>
    <p>Ask about any opportunity, projection, or descriptor in your book.</p>
  </header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask a question..." autocomplete="off" autofocus>
    <button id="send" type="submit">Send</button>
  </form>
  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const history = [];

    function addMsg(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      send.disabled = true;

      addMsg('user', text);
      history.push({ role: 'user', content: text });
      const pending = addMsg('assistant', 'Thinking…');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        pending.textContent = data.reply;
        history.push({ role: 'assistant', content: data.reply });
      } catch (err) {
        pending.className = 'msg error';
        pending.textContent = err.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
